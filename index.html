<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a73e8">
  <!-- 加入主畫面（web app）時：狀態列透明、網頁畫面佔滿整個螢幕。
       沒有這個設定時 iOS 會把網頁放到狀態列底下，但高度仍扣掉狀態列，底部留下一條空白 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>旅程地圖規劃</title>
  <!-- Material Symbols：只載入用到的圖示（icon_names 需依字母排序） -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=collections_bookmark,delete,directions,edit,event&display=block">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="map"></div>
  <div id="mapError" class="map-error" hidden></div>

  <!-- 疊加在地圖上的排程 UI：天數時間軸 → 當日區塊 → 區塊內地點 -->
  <div id="overlay" class="overlay">
    <div class="topbar">
      <button id="menuBtn" class="round-btn" aria-label="旅程設定" title="旅程設定">☰</button>
      <div id="searchBox" class="search-box">
        <input id="searchInput" class="search-input" type="search" placeholder="搜尋地點…" enterkeyhint="search" autocomplete="off" aria-label="搜尋地點">
        <button id="filterBtn" class="filter-btn" title="進階搜尋" aria-label="進階搜尋" aria-expanded="false">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M3 5h18l-7 8.2V19l-4 2v-7.8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        </button>
        <ul id="suggestions" class="suggestions" role="listbox" hidden></ul>
      </div>
    </div>
    <!-- 進階搜尋：營業時間篩選 -->
    <section id="searchFilters" class="search-filters" hidden></section>
    <!-- 搜尋結果清單：可收起成一列 -->
    <section id="searchPanel" class="search-panel" hidden></section>
    <nav id="timeline" class="timeline" aria-label="天數"></nav>
    <section id="dayPanel" class="day-panel" hidden></section>
    <section id="libraryPanel" class="day-panel" hidden></section>
  </div>

  <div id="menu" class="menu" hidden>
    <div class="menu-card" role="dialog" aria-label="旅程設定">
      <!-- 專案：每個專案是一份獨立的存檔 -->
      <div class="menu-section">
        <div class="menu-section-title">專案</div>
        <div class="project-row">
          <select id="projectSelect" class="project-select" aria-label="切換專案"></select>
          <button id="newProjectBtn" class="btn small">新增</button>
          <button id="deleteProjectBtn" class="btn small danger">刪除</button>
        </div>
      </div>
      <div id="modeSwitch" class="mode-switch" role="group" aria-label="編輯模式">
        <button data-mode="trip"><span class="material-symbols-outlined ms-event" aria-hidden="true">event</span>每日行程</button>
        <button data-mode="library"><span class="material-symbols-outlined ms-collections_bookmark" aria-hidden="true">collections_bookmark</span>地點庫</button>
      </div>
      <div id="tripSettings" class="trip-settings">
        <label class="field">旅程名稱
          <input id="tripTitle" placeholder="旅程名稱">
        </label>
        <label class="field">出發日
          <input id="startDate" type="date">
        </label>
        <label class="check">
          <input id="showAll" type="checkbox"> 在地圖上顯示全部天數
        </label>
      </div>
      <!-- 遠端（GitHub）：內容由 remote.js 產生 -->
      <div id="remotePanel" class="menu-section remote-panel"></div>
      <div class="menu-actions">
        <button id="exportBtn" class="btn">匯出</button>
        <button id="importBtn" class="btn">匯入</button>
        <button id="resetBtn" class="btn danger">清空</button>
        <span class="spacer"></span>
        <button id="menuDone" class="btn primary">完成</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input id="importFile" type="file" accept="application/json,.json" hidden>
  <!-- 地點庫：匯入 Google 地圖「已儲存」清單（Google Takeout 的 CSV，可多選） -->
  <input id="savedListFile" type="file" accept=".csv,text/csv" multiple hidden>
  <!-- 地點庫：從其他人或其他裝置匯出的 JSON 合併分類 -->
  <input id="libraryFile" type="file" accept="application/json,.json" hidden>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
  <script src="config.js"></script>
  <!-- 依序載入：資料結構 → Google Maps → 畫面與操作流程 → 遠端（共用全域作用域） -->
  <script src="store.js"></script>
  <script src="gmaps.js"></script>
  <script src="app.js"></script>
  <!-- 遠端：GitHub API → 三方合併 → 選單中的遠端操作介面 -->
  <script src="github.js"></script>
  <script src="merge.js"></script>
  <script src="remote.js"></script>
</body>
</html>
